global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aegis-peru
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: aegis-core
    static_configs:
      - targets: ['core:8000']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s

  - job_name: aegis-worker
    static_configs:
      - targets: ['worker:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres:9187']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis:9121']

  - job_name: neo4j-exporter
    static_configs:
      - targets: ['neo4j:2004']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
