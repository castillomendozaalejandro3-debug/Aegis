version: "3.9"

networks:
  aegis_public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  aegis_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.1.0/24
  aegis_tor:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.2.0/24

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
  evidence_storage:
  prometheus_data:
  grafana_data:
  vault_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  neo4j_password:
    file: ./secrets/neo4j_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis_peru
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.10
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_peru"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    secrets:
      - postgres_password

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data:/data
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.11
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    secrets:
      - redis_password

  # ── Neo4j ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5.14-community
    container_name: aegis-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegis-peru-2026}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/neo4j.conf:/conf/neo4j.conf:ro
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.12
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    secrets:
      - neo4j_password

  # ── Qdrant ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: aegis-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant/qdrant.yaml:/qdrant/config/production.yaml:ro
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.13
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # ── Tor Gateway ─────────────────────────────────────────
  tor-gateway:
    image: dperson/torproxy:latest
    container_name: aegis-tor
    restart: unless-stopped
    networks:
      aegis_tor:
        ipv4_address: 172.20.2.10
    ports:
      - "127.0.0.1:9050:9050"
      - "127.0.0.1:9051:9051"
    healthcheck:
      test: ["CMD-SHELL", "curl --socks5-hostname localhost:9050 -s https://check.torproject.org | grep -q Congratulations"]
      interval: 60s
      timeout: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # ── Vault Agent ─────────────────────────────────────────
  vault-agent:
    image: hashicorp/vault:1.15
    container_name: aegis-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-aegis-vault-dev}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.14
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # ── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aegis-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.15
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    security_opt:
      - no-new-privileges:true

  # ── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: aegis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://grafana.aegis-peru.local"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.16
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    secrets:
      - grafana_password

  # ── Kong Gateway ────────────────────────────────────────
  kong:
    image: kong:3.5
    container_name: aegis-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_SSL_CERT: /certs/server.crt
      KONG_SSL_CERT_KEY: /certs/server.key
      KONG_SSL_CA_CERT: /certs/ca.crt
      KONG_PLUGINS: "rate-limiting,jwt,cors,ip-restriction"
    volumes:
      - ./docker/kong/kong.yml:/kong/declarative/kong.yml:ro
      - ./docker/certs:/certs:ro
    networks:
      aegis_public:
        ipv4_address: 172.20.0.10
      aegis_internal:
        ipv4_address: 172.20.1.17
    ports:
      - "80:8000"
      - "443:8443"
      - "127.0.0.1:8001:8001"
    depends_on:
      - core
    security_opt:
      - no-new-privileges:true

  # ── Core API ────────────────────────────────────────────
  core:
    build:
      context: .
      dockerfile: docker/core/Dockerfile
    container_name: aegis-core
    restart: unless-stopped
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-production}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_DSN: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:-aegis-secure-2026}@postgres:5432/aegis_peru
      REDIS_URL: redis://:${REDIS_PASSWORD:-aegis-redis-2026}@redis:6379/0
      TOR_PROXY: socks5h://tor-gateway:9050
      VAULT_ADDR: http://vault-agent:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-aegis-vault-dev}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_ID: ${CENSYS_API_ID:-}
      CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
      LOG_LEVEL: INFO
      MAX_FILE_SIZE_MB: 50
      EVIDENCE_STORAGE_PATH: /app/evidence
      UPLOAD_STORAGE_PATH: /app/uploads
    volumes:
      - evidence_storage:/app/evidence
      - ./docker/certs:/certs:ro
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.20
      aegis_tor:
        ipv4_address: 172.20.2.20
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    secrets:
      - jwt_secret
      - neo4j_password
      - postgres_password
      - redis_password

  # ── Worker ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: aegis-worker
    restart: unless-stopped
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-production}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_DSN: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:-aegis-secure-2026}@postgres:5432/aegis_peru
      REDIS_URL: redis://:${REDIS_PASSWORD:-aegis-redis-2026}@redis:6379/0
      TOR_PROXY: socks5h://tor-gateway:9050
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-aegis-redis-2026}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-aegis-redis-2026}@redis:6379/1
      LOG_LEVEL: INFO
    volumes:
      - evidence_storage:/app/evidence
    networks:
      aegis_internal:
        ipv4_address: 172.20.1.21
      aegis_tor:
        ipv4_address: 172.20.2.21
    depends_on:
      - redis
      - postgres
      - neo4j
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
    secrets:
      - neo4j_password
      - redis_password

  # ── UI ──────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: aegis-ui
    restart: unless-stopped
    networks:
      aegis_public:
        ipv4_address: 172.20.0.20
    ports:
      - "127.0.0.1:8443:443"
    depends_on:
      - core
    security_opt:
      - no-new-privileges:true
